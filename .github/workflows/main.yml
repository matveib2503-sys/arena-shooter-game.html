<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena Shooter</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1020;--fg:#e8ecff;--ac:#ffb703;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1020;--fg:#e8ecff}}
:root[data-theme="dark"]{--bg:#0b1020;--fg:#e8ecff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#g{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;inset:0;display:none;pointer-events:none}
.z{position:absolute;top:0;height:100%;width:50%;pointer-events:auto}
#top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 12px;z-index:3}
button{font:inherit;color:var(--fg)}
#mb{pointer-events:auto;width:44px;height:44px;border-radius:12px;border:0;background:rgba(0,0,0,.45);font-size:22px}
#ctr{text-align:center;text-shadow:0 1px 3px #000}#ctr b{font-size:20px;letter-spacing:4px;color:var(--ac)}#info{font-size:13px}
#hpw{width:110px;height:12px;background:rgba(0,0,0,.5);border-radius:6px;overflow:hidden;margin-top:6px}#hp{display:block;height:100%;background:#4ade80;width:100%}
#cross{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;background:linear-gradient(#fff,#fff) center/2px 100% no-repeat,linear-gradient(#fff,#fff) center/100% 2px no-repeat;opacity:.7}
#hm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px;color:#fff;opacity:0;transition:opacity .15s}
#dmg{position:absolute;inset:0;background:radial-gradient(transparent 40%,rgba(255,0,0,.7));opacity:0;transition:opacity .4s}
#bn{position:absolute;top:28%;width:100%;text-align:center;font-size:34px;font-weight:800;color:var(--ac);text-shadow:0 2px 6px #000;opacity:0;transition:opacity .4s}
#fire,#rel{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,60,60,.35);pointer-events:auto;z-index:2}
#fire{right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:88px;height:88px;font-size:30px}
#rel{right:124px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:58px;height:58px;font-size:22px;background:rgba(255,255,255,.2)}
#ads,#jp,#cr{position:absolute;width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.2);font-size:22px;pointer-events:auto;z-index:2;opacity:.85}#ads{right:124px;bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}#jp{right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 170px)}#cr{right:190px;bottom:calc(env(safe-area-inset-bottom,0px) + 110px)}
#ct{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translateX(-50%);display:none;gap:8px;z-index:6;pointer-events:auto}#ct button{padding:12px 16px;border-radius:10px;border:0;background:rgba(0,0,0,.75);font-weight:700}
#fps{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 44px);font:700 13px system-ui;color:#fbbf24;z-index:20;pointer-events:none;text-shadow:0 1px 2px #000}
#sb{position:absolute;left:0;top:0;bottom:0;width:64px;display:none;flex-direction:column;background:rgba(0,0,0,.55);z-index:2}#ov.sb #sb{display:flex}#sb button{flex:1;border:0;background:transparent;font-size:24px;border-bottom:1px solid rgba(255,255,255,.1)}#sb button.on{background:rgba(255,255,255,.18)}#ov.sb{padding-left:76px}#ov.sb #pv{left:76px}
.row{width:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;text-align:left}.row b{flex:1 1 140px;font-size:14px}.row input{flex:2 1 160px}.row .v{opacity:.7;font-size:13px;min-width:36px}.og{display:flex;gap:6px;flex:2 1 230px}#ob .og button{width:auto;flex:1;padding:8px 2px;font-size:11px;border-radius:8px}
.noui #ctr,.noui #hpw,.noui #ammo{display:none}
#ts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;opacity:0;transition:opacity .3s;pointer-events:none;max-width:80vw;text-align:center}
.num{flex:1 1 100%;box-sizing:border-box;padding:12px;border-radius:10px;border:0;background:rgba(255,255,255,.15);color:var(--fg);font-size:18px}
#pb{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);transform:translateX(-50%);display:none;padding:16px 22px;font-size:18px;font-weight:800;border-radius:14px;border:2px solid #fff;background:rgba(239,68,68,.75);pointer-events:auto;z-index:3}#gr{position:absolute;right:190px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:58px;height:58px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(255,160,0,.3);font-size:18px;pointer-events:auto;z-index:2}#ammo{position:absolute;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);font-weight:700;font-size:20px;text-shadow:0 1px 3px #000}
#jb{position:absolute;width:90px;height:90px;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:none}
#jk{position:absolute;left:25px;top:25px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55)}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,12,24,.85);z-index:9;text-align:center;padding:20px}
#ot{font-size:36px;font-weight:900;letter-spacing:2px;color:var(--ac)}#os{opacity:.85;line-height:1.5}
#ob{display:flex;flex-wrap:wrap;gap:10px;width:290px;max-height:56vh;overflow-y:auto;touch-action:pan-y}#ob button{width:100%;box-sizing:border-box}#ob button.h{width:calc(50% - 5px);font-size:15px}#ob button.m{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;text-align:left;font-size:16px}
#ob button{padding:14px;border-radius:14px;border:0;background:var(--ac);color:#111;font-weight:700;font-size:18px}
#ob button.s{background:rgba(255,255,255,.14);color:var(--fg)}#ob button.on{background:#22c55e;color:#111}#pv{position:absolute;left:8px;top:calc(env(safe-area-inset-top,0px) + 8px);width:130px;height:180px}#coin{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 14px);font-weight:800;font-size:20px;color:var(--ac)}
/* ===== стиль лобби как в Standoff 2 ===== */
#ov{background:radial-gradient(ellipse at 70% 100%,rgba(255,120,40,.28),transparent 55%),radial-gradient(ellipse at 20% 0%,rgba(90,110,160,.35),transparent 60%),linear-gradient(135deg,#2a2d38,#3b3238 60%,#4a3529);font-family:Oswald,'Arial Narrow',system-ui,sans-serif}
#ov::before{content:'';position:absolute;right:8%;top:12%;width:46vmin;height:46vmin;border-radius:50%;border:2vmin solid rgba(255,255,255,.04);box-shadow:inset 0 0 0 4vmin rgba(255,255,255,.03);pointer-events:none}
#ot{color:#fff;text-transform:uppercase;font-size:30px}#ot:empty,#os:empty{display:none}
#ob button{font-family:Oswald,'Arial Narrow',system-ui,sans-serif;text-transform:uppercase;letter-spacing:.5px;border-radius:2px;background:#7391c9;color:#fff;font-weight:700}
#ob button.s{background:#34373f;color:#e6e9f2}#ob button.on{background:#7391c9;color:#fff}
#sb{background:#1d1e23}#sb button{color:#8b8f99;filter:grayscale(1)}#sb button.on{background:#3a3c44;filter:none;color:#fff}
#ov.lobby{padding-left:220px}
#pc{position:absolute;left:76px;top:calc(env(safe-area-inset-top,0px) + 10px);display:none;gap:10px;align-items:center;background:rgba(0,0,0,.35);padding:8px 12px;z-index:3;min-width:190px;text-align:left}
#ov.lobby #pc,#ov.lobby #rp{display:flex}
#pc .av{font-size:30px;width:48px;height:48px;display:grid;place-items:center;background:#555}
#pc .pi{display:flex;flex-direction:column;gap:2px}#pc b{font-size:18px}#pc small{opacity:.7}
.xp{display:flex;align-items:center;gap:6px}.xp span{background:#c58a1c;color:#fff;font-weight:700;padding:1px 7px;font-size:13px}.xp i{display:block;width:110px;height:6px;background:rgba(255,255,255,.2)}.xp u,.xp2 u{display:block;height:100%;background:#f2a73b;text-decoration:none}
#rp{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 56px);width:210px;display:none;flex-direction:column;gap:6px;background:rgba(0,0,0,.35);padding:10px 12px;z-index:3;text-align:left}#rp b{font-size:18px;color:#f2a73b}#rp small{opacity:.8}.xp2{height:6px;background:rgba(255,255,255,.2)}
@media(max-width:900px){#rp{display:none!important}}
#ov.lobby #pv{top:100px;left:76px}
#coin{background:#3b4a63;padding:6px 14px;color:#fff;font-weight:700;border-radius:2px}
.tabs{display:flex;width:100%;gap:2px}#ob .tab{flex:1;background:#2a2c33;color:#9aa0ad;padding:12px 4px;font-size:16px}#ob .tab.on{background:#454851;color:#fff}
.modes{display:flex;gap:8px;width:100%}#ob .mode{flex:1;background:#2f323b;color:#fff;padding:12px 8px;display:flex;flex-direction:column;gap:4px;text-align:center;font-size:15px;border-bottom:3px solid transparent}#ob .mode small{opacity:.65;font-size:11px;text-transform:none}#ob .mode.on{background:#3d4660;border-bottom-color:#7391c9}
#ob .play{width:100%;margin-top:6px;padding:16px;font-size:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;width:100%}#ob .card{position:relative;height:96px;padding:0;background:#3a3b41;text-align:center}#ob .card .ic{font-size:36px;display:block;margin-top:10px}#ob .card em{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:12px;padding:5px 2px;color:#fff}#ob .card .ck{position:absolute;top:4px;right:6px;color:#fbbf24;font-style:normal}
/* ===== HUD в стиле Standoff + покупка + свежее меню ===== */
#fire,#fire2,#ads,#rel,#qs,#jp,#cr,#gr,#buyb,#w1,#w2,#w3,#pb,#ammo{inset:auto}
#fire,#fire2,#ads,#rel,#qs,#jp,#cr,#gr,#buyb,#w1,#w2,#w3{position:absolute;display:grid;place-items:center;color:#e8ecf5;background:rgba(28,30,36,.55);border:2px dashed rgba(255,255,255,.42);pointer-events:auto;z-index:2;padding:0;font-family:Oswald,'sans-serif-condensed','Arial Narrow',system-ui,sans-serif;opacity:1}
#fire,#fire2,#ads,#rel,#qs,#jp,#cr,#gr,#buyb{border-radius:50%}
#fire svg,#fire2 svg,#ads svg,#rel svg,#qs svg,#jp svg,#cr svg,#gr svg,#buyb svg{width:54%;height:54%}
#fire{right:112px;bottom:56px;width:88px;height:88px;background:rgba(190,60,60,.38)}
#fire2{left:104px;top:calc(env(safe-area-inset-top,0px) + 70px);width:76px;height:76px;background:rgba(190,60,60,.3)}
#ads{right:22px;top:calc(env(safe-area-inset-top,0px) + 56px);width:62px;height:62px}
#rel{right:92px;top:calc(env(safe-area-inset-top,0px) + 62px);width:50px;height:50px}
#gr{right:152px;top:calc(env(safe-area-inset-top,0px) + 62px);width:50px;height:50px}
#qs{right:208px;top:calc(env(safe-area-inset-top,0px) + 64px);width:44px;height:44px}
#jp{right:22px;bottom:128px;width:66px;height:66px}
#cr{right:22px;bottom:50px;width:66px;height:66px}
#buyb{left:calc(50% - 198px);bottom:12px;width:46px;height:46px}
#gr i{position:absolute;right:-4px;bottom:-4px;font:700 12px Oswald,sans-serif;font-style:normal;background:#f59e0b;color:#111;border-radius:8px;padding:0 5px}
#w1,#w2,#w3{bottom:8px;width:84px;height:46px;border-radius:6px;gap:0;align-content:center}
#w1{left:calc(50% - 134px)}#w2{left:calc(50% - 42px)}#w3{left:calc(50% + 50px)}
#w1 svg,#w2 svg,#w3 svg{width:30px;height:18px}#w1 small,#w2 small,#w3 small{font-size:11px;opacity:.9}
#w1.on,#w2.on,#w3.on{border-style:solid;border-color:#7391c9;background:rgba(115,145,201,.4)}
#ammo{left:50%;bottom:58px;transform:translateX(-50%);text-align:center;font:700 26px Oswald,'sans-serif-condensed','Arial Narrow',sans-serif;text-shadow:0 1px 3px #000;line-height:1;pointer-events:none}
#ammo span{font-size:16px;opacity:.7}#ammo small{display:block;font-size:12px;opacity:.8;font-weight:500}
#pb{left:50%;bottom:118px;padding:12px 20px;font-family:Oswald,sans-serif;letter-spacing:.5px}
.nowb #w1,.nowb #w2,.nowb #w3,.nowb #qs{display:none}.nof2 #fire2{display:none}
#arw{width:110px;height:6px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden;margin-top:4px}#arm{display:block;height:100%;background:#7391c9;width:0}.noui #arw{display:none}
#hm{font-family:Oswald,sans-serif;font-weight:700;text-shadow:0 1px 3px #000;transform:translate(-50%,-150%)}
#bm{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);z-index:7;font-family:Oswald,'sans-serif-condensed','Arial Narrow',sans-serif}
.bp{width:min(680px,94vw);max-height:90vh;background:#1d1e23;display:flex;flex-direction:column;padding:10px;gap:8px;box-sizing:border-box}
.bh{display:flex;justify-content:space-between;align-items:center;font-size:20px}.bh button{width:40px;height:40px;border:0;background:#34373f;color:#fff;font-size:18px}
.btabs{display:flex;gap:2px}.btabs button{flex:1;padding:10px 2px;border:0;background:#2a2c33;color:#9aa0ad;font:700 13px Oswald,sans-serif}.btabs button.on{background:#7391c9;color:#fff}
.bg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;overflow-y:auto;touch-action:pan-y}
.bi{display:flex;flex-direction:column;align-items:flex-start;padding:8px;border:0;background:#2f323b;color:#fff;text-align:left;font-family:Oswald,sans-serif;gap:2px}.bi b{font-size:15px}.bi small{opacity:.7;font-size:12px}.bi.dis{opacity:.4}.bi.own{border-left:3px solid #4ade80}
#sb button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}#sb small{font:600 9px Oswald,sans-serif;letter-spacing:.5px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
#ob .mode{background:linear-gradient(160deg,rgba(255,255,255,.1),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.12);border-radius:10px;font-family:'Russo One',Oswald,sans-serif;padding:12px 6px}
#ob .mode b{font-size:13px;line-height:1.15}#ob .mode.on{background:linear-gradient(160deg,#4a5f93,#2c3b63);border-color:#7391c9}
#ob .play{font-family:'Russo One',Oswald,sans-serif;letter-spacing:1px;background:linear-gradient(135deg,#6f8fdc,#4a63b8);box-shadow:0 0 22px rgba(115,145,201,.45)}
.gs{width:60%;height:46px;margin-top:12px}
#spec{position:absolute;top:calc(env(safe-area-inset-top,0px) + 54px);left:0;right:0;text-align:center;font:700 16px Oswald,'sans-serif-condensed',sans-serif;text-shadow:0 1px 3px #000;pointer-events:none;z-index:1}#spec small{font-weight:500;opacity:.8;font-size:12px}
#insp{position:absolute;inset:auto;right:262px;top:calc(env(safe-area-inset-top,0px) + 66px);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#e8ecf5;background:rgba(28,30,36,.55);border:2px dashed rgba(255,255,255,.42);pointer-events:auto;z-index:2;padding:0}
#insp svg{width:55%;height:55%}.nowb #insp{display:none}
#rp{cursor:pointer}
</style>
</head>
<body>
<canvas id="g"></canvas>
<div id="hud">
 <div class="z" id="zl" style="left:0"><div id="jb"><div id="jk"></div></div></div>
 <div class="z" id="zr" style="right:0"></div>
 <div id="cross"></div><div id="hm">✕</div><div id="dmg"></div><div id="bn"></div>
 <div id="top"><button id="mb">☰</button><div id="ctr"><b>GAME</b><div id="info"></div></div><div><div id="hpw"><i id="hp"></i></div><div id="arw"><i id="arm"></i></div></div></div>
 <div id="ammo"></div><div id="spec"></div><button id="rel"></button><button id="gr"></button><button id="pb"></button><div id="ct"><button id="ca">Применить</button><button id="cd">По умолчанию</button><button id="cc">Закрыть</button></div><button id="ads"></button><button id="jp"></button><button id="cr"></button><button id="fire"></button><button id="fire2"></button><button id="buyb"></button><button id="w1"></button><button id="w2"></button><button id="w3"></button><button id="qs"></button><button id="insp"></button>
</div>
<div id="bm"><div class="bp"><div class="bh"><b>ЗАКУПКА</b><span id="bmn"></span><button id="bx">✕</button></div><div class="btabs" id="btabs"></div><div class="bg" id="bgrid"></div></div></div><div id="fps"></div><div id="ts"></div><div id="ov"><div id="sb"></div><div id="pc"><div class="av" id="av">И</div><div class="pi"><b id="pn">Игрок</b><div class="xp"><span id="pl">1</span><i><u id="px"></u></i></div><small id="pr"></small><small id="pid"></small></div></div><div id="rp"><b id="sn1">СЕЗОН 1</b><small id="sn2"></small><div class="xp2"><u id="rx"></u></div><span id="rn"></span></div><canvas id="pv"></canvas><div id="coin"></div><div id="ot"></div><div id="os"></div><div id="ob"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=i=>document.getElementById(i);
const DEF={sens:4.2,ads:2.8,acc:.2,smooth:.25,shader:3,tex:3,dist:3,fx:3,res:3,fps:1,ui:0,hands:1,vol:1,wb:1,f2:1,diff:2};
const ST=Object.assign({},DEF);try{Object.assign(ST,JSON.parse(localStorage.getItem('as_st')||'{}'))}catch(_){}
const saveST=()=>{try{localStorage.setItem('as_st',JSON.stringify(ST))}catch(_){}};
const sm={x:0,y:0};const TR=[];let TRt=0;let fc=0,ft0=performance.now(),sfc=0;
function mkTex(sz){const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,sz,sz);for(let i=0;i<sz*sz/10;i++){const g=190+Math.random()*65|0;x.fillStyle='rgb('+g+','+g+','+g+')';x.fillRect(Math.random()*sz,Math.random()*sz,2,2)}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(20,20);return t}
/* ---------- звук ---------- */
let ac,mg,comp,nb,mute=false;
function aud(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();comp=ac.createDynamicsCompressor();mg=ac.createGain();comp.connect(mg);mg.connect(ac.destination);nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(_){}}if(ac&&ac.state==='suspended')ac.resume();if(mg)mg.gain.value=mute?0:.8*ST.vol;return ac}
function nz(dur,f0,f1,v,type='lowpass',q=1){const a=aud();if(!a)return;const n=a.currentTime,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=nb;f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,n);f.frequency.exponentialRampToValueAtTime(f1,n+dur);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);s.connect(f);f.connect(g);g.connect(comp);s.start(n,Math.random()*.5);s.stop(n+dur+.02)}
function tn(type,f0,f1,dur,v,dl=0){const a=aud();if(!a)return;const n=a.currentTime+dl,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,n);o.frequency.exponentialRampToValueAtTime(f1,n+dur);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+dur);o.connect(g);g.connect(comp);o.start(n);o.stop(n+dur+.02)}
const SFX={
shot:()=>{nz(.28,4500,250,.9);nz(.05,9000,3000,.5,'highpass');tn('sine',180,45,.2,.9)},
eshot:v=>{nz(.22,2500,250,.5*v);tn('sine',140,40,.15,.5*v)},
hit:()=>tn('sine',1500,1100,.06,.35),
head:()=>{tn('sine',2200,1800,.08,.4);tn('sine',1100,900,.1,.3)},
