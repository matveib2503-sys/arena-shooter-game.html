<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мессенджер</title>
<style>
:root{--bg:#fff;--sf:#f1f3f5;--tx:#111827;--mu:#6b7280;--ac:#3390ec;--bd:#e5e7eb;--ot:#f1f3f5;--me:#effdde;--hd:linear-gradient(135deg,#3b82f6,#6366f1);--inb:#fff;--wp:linear-gradient(160deg,#e6eefc,#f1ebfb);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17212b;--sf:#202b36;--tx:#f5f5f5;--mu:#7f91a4;--ac:#5eb5f7;--bd:#0e1621;--ot:#202b36;--me:#2b5278;--hd:#242f3d;--inb:#182533;--wp:#0e1621;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17212b;--sf:#202b36;--tx:#f5f5f5;--mu:#7f91a4;--ac:#5eb5f7;--bd:#0e1621;--ot:#202b36;--me:#2b5278;--hd:#242f3d;--inb:#182533;--wp:#0e1621;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea{font:inherit;color:inherit}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
#main{flex:1;overflow-y:auto;padding:0 0 8px}
h1{font-size:22px;margin:0;padding:14px 16px 8px;display:flex;justify-content:space-between;align-items:center}
nav{display:flex;border-top:1px solid var(--bd);background:var(--bg)}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;font-size:20px;color:var(--mu);cursor:pointer}
nav button small{display:block;font-size:11px}nav button.on{color:var(--ac)}
.av{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:20px;flex:none}
.row{display:flex;gap:12px;align-items:center;padding:10px 16px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.row:hover{background:var(--sf)}
.row .t{flex:1;min-width:0}.row b{display:block}.row span.s{color:var(--mu);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row time{color:var(--mu);font-size:12px}
.ib{border:0;background:var(--sf);border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}
.btn{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.g{background:var(--sf);color:var(--tx)}
.ov{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:5}
.ov[hidden],#modal[hidden],#sv[hidden]{display:none}
header{display:flex;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--bd)}
header .ct{flex:1;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ml{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:4px}
.m{max-width:80%;padding:7px 11px;border-radius:16px;background:var(--ot);align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere}
.m.me{background:var(--me);align-self:flex-end}.rp{border-left:3px solid var(--ac);padding:2px 8px;margin-bottom:4px;font-size:12px;opacity:.85;border-radius:2px;display:block}
.m .n{font-size:12px;font-weight:600;opacity:.75;display:block}.m time{font-size:10px;opacity:.6;margin-left:8px;float:right;margin-top:4px}
.cb{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--bd)}
.cb input{flex:1;border:1px solid var(--bd);background:var(--sf);border-radius:20px;padding:9px 14px;outline:0}
.send{border:0;background:var(--ac);color:#fff;border-radius:50%;width:40px;height:40px;cursor:pointer}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:8;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;border-radius:18px 18px 0 0;padding:16px;max-height:85%;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.sheet input,.sheet textarea,.f input,.f textarea{border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:10px;width:100%;outline:0}
.sw{display:flex;gap:8px}.sw i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw i.on{border-color:var(--tx)}
.f{padding:8px 16px;display:flex;flex-direction:column;gap:10px}
.strip{display:flex;gap:14px;overflow-x:auto;padding:6px 16px 12px}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;cursor:pointer;border:0;background:none;flex:none;width:64px}
.ring{padding:3px;border-radius:50%;background:linear-gradient(45deg,#f59e0b,#ec4899,#8b5cf6)}.ring.add{background:var(--bd)}
.ring .av{border:3px solid var(--bg);width:54px;height:54px}
#sv{position:absolute;inset:0;z-index:9;color:#fff;display:flex;flex-direction:column;cursor:pointer}
#sv .bars{display:flex;gap:4px;padding:10px 12px 0}#sv .bars i{flex:1;height:3px;background:rgba(255,255,255,.35);border-radius:2px}#sv .bars i.d{background:#fff}
#sv .tx{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:26px;font-weight:600;padding:24px;overflow-wrap:anywhere}
.sh{display:flex;align-items:center;gap:10px;padding:10px 12px}
.empty{color:var(--mu);text-align:center;padding:40px 20px}
.toast{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:20px;z-index:20;font-size:13px}
nav[hidden]{display:none}
h1.hd{background:var(--hd);color:#fff;font-size:19px;padding:10px 12px;gap:10px;justify-content:flex-start;position:sticky;top:0;z-index:2}
.hd .ib,header .ib{background:none;color:#fff;font-size:20px}
header{background:var(--hd);color:#fff;border:0}
header .av{width:38px;height:38px;font-size:17px}
header .ct{line-height:1.2}
#ml{background:var(--wp)}
.m{background:var(--inb);border-radius:12px 12px 12px 4px;box-shadow:0 1px 1px rgba(0,0,0,.13)}
.m.me{border-radius:12px 12px 4px 12px}
.m time{display:inline-block}
.cb{border:0;background:var(--wp);padding:6px 8px 8px;align-items:center}
.cb input{background:var(--inb);border:0;border-radius:22px;padding:11px 16px}
.cb .ib{background:var(--inb);color:var(--mu)}
.row .av{width:54px;height:54px}
.row time{align-self:flex-start;margin-top:6px}
.dr{width:78%;max-width:300px;height:100%;max-height:100%;border-radius:0;padding:0;gap:0}
#modal.l{align-items:stretch}
.dr .top{background:var(--hd);color:#fff;padding:20px 16px;display:flex;flex-direction:column;gap:8px}
.dr .row{padding:12px 16px}
#ph{display:none}
@media(min-width:820px){
#app{max-width:1100px;border-left:1px solid var(--bd);border-right:1px solid var(--bd)}
#main{position:absolute;left:0;top:0;bottom:54px;width:360px;border-right:1px solid var(--bd)}
#nav{position:absolute;left:0;bottom:0;width:360px;height:54px}
#chat{left:360px}
#ph{position:absolute;left:360px;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--wp)}
header [data-a=back]{display:none}
}
body{-webkit-font-smoothing:antialiased}
h1.hd,header{box-shadow:0 2px 12px rgba(0,0,0,.12)}
.row{padding:11px 14px;margin:2px 8px;width:calc(100% - 16px);border-radius:14px;transition:background .15s}
.row:active{background:var(--sf)}
.row b{font-weight:600}
.av{box-shadow:inset 0 -8px 14px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.15)}
nav{background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-top:0;box-shadow:0 -1px 10px rgba(0,0,0,.06)}
nav button.on{font-weight:600}
.btn{background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:14px;padding:12px 18px;box-shadow:0 4px 14px rgba(59,130,246,.35);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.g{background:var(--sf);color:var(--tx);box-shadow:none}
.sheet{border-radius:24px 24px 0 0;padding:20px;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet::before{content:"";width:40px;height:4px;border-radius:2px;background:var(--bd);align-self:center;flex:none}
.dr::before{display:none}
.sheet input,.sheet textarea,.f input,.f textarea{border-radius:14px;padding:12px 14px;transition:border-color .15s,box-shadow .15s}
.f input:focus,.f textarea:focus,.sheet input:focus,.sheet textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
.m{padding:8px 12px;animation:pop .18s ease-out}
.m.me{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff}
.m.me .rp{border-color:#fff}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}}
.cb input{box-shadow:0 1px 4px rgba(0,0,0,.08)}
.send{background:linear-gradient(135deg,#3b82f6,#6366f1);box-shadow:0 3px 10px rgba(59,130,246,.4)}
.wl{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:24px 0 6px;color:var(--mu)}
.wl .lg{width:84px;height:84px;border-radius:26px;background:linear-gradient(135deg,#3b82f6,#6366f1);display:flex;align-items:center;justify-content:center;font-size:42px;box-shadow:0 10px 28px rgba(99,102,241,.4)}
.wl h1{padding:8px 0 0;color:var(--tx);font-size:26px;display:block}
.hint{color:var(--mu);font-size:12px;margin-top:-4px}
nav{padding:6px 8px 4px;gap:4px}
nav button{font-size:12px;border-radius:16px}
nav button small{font-size:12px;font-weight:500}
nav button svg{display:block;margin:0 auto 3px;width:24px;height:24px;padding:4px 16px;box-sizing:content-box;border-radius:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:background .2s}
nav button.on svg{background:color-mix(in srgb,var(--ac) 18%,transparent)}
.seg{display:flex;background:var(--sf);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:10px;font-weight:600;color:var(--mu);cursor:pointer;transition:all .2s}
.seg button.on{background:var(--bg);color:var(--tx);box-shadow:0 1px 5px rgba(0,0,0,.18)}
.bg{display:block;margin:4px 0 0 auto;background:var(--ac);color:#fff;border-radius:11px;min-width:22px;padding:1px 7px;text-align:center;font-style:normal;font-size:12px;font-weight:600;width:max-content}
.row time{text-align:right}
.im{display:block;max-width:100%;max-height:300px;border-radius:10px;margin-bottom:4px;cursor:zoom-in}
.fl{border:0;background:rgba(127,127,127,.18);border-radius:10px;padding:8px 10px;margin-bottom:4px;cursor:pointer;color:inherit;display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.rx{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;clear:both}.rx span{background:rgba(127,127,127,.2);border-radius:10px;padding:1px 7px;font-size:12px}
.emr{display:flex;justify-content:space-around}
.pbar{background:var(--sf);padding:6px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid var(--bd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr{display:flex;gap:8px;padding:10px 12px}.sr input{flex:1;border:0;border-radius:22px;padding:11px 16px;background:rgba(255,255,255,.92);color:#111}
#lock{position:absolute;inset:0;z-index:30;background:var(--bg);display:flex}#lock[hidden]{display:none}
</style></head>
<body>
<div id="app">
<div id="main"><div class="empty">Загрузка…</div></div>
<nav id="nav" hidden>
<button data-a="tab" data-v="chats"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg><small>Чаты</small></button>
<button data-a="tab" data-v="stories"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" stroke-dasharray="3.2 2.4"/><circle cx="12" cy="12" r="3.2"/></svg><small>Истории</small></button>
<button data-a="tab" data-v="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-5 8-5s6.5 1 8 5"/></svg><small>Профиль</small></button>
</nav>
<div id="ph"><span style="background:rgba(0,0,0,.35);padding:4px 14px;border-radius:14px">Выберите, кому написать</span></div>
<div id="chat" class="ov" hidden></div>
<div id="modal" hidden></div>
<div id="sv" hidden></div>
<div id="lock" hidden></div>
<style id="th"></style>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COL=['#3390ec','#db2777','#16a34a','#ea580c','#7c3aed','#0891b2'];
const MIT=`MIT License

Copyright (c) 2026 The authors

Permission is hereby granted, free of charge, to any person obtaining a copy of this software and associated documentation files (the "Software"), to deal in the Software without restriction, including without limitation the rights to use, copy, modify, merge, publish, distribute, sublicense, and/or sell copies of the Software, and to permit persons to whom the Software is furnished to do so, subject to the following conditions:

The above copyright notice and this permission notice shall be included in all copies or substantial portions of the Software.

THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY, FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM, OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE SOFTWARE.
`;
let db,dl,uid,me,profiles={},chats=[],stories=[],cur=null,msgs=[],unM=null,tab='chats',ready={p:0,c:0},draft={color:COL[0]},storyBg=COL[1],svT=null,q='',reply=null,newKind='group',room=null,peers=[],acct={};

function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('#app').append(e);setTimeout(()=>e.remove(),2500)}
function fail(t){$('#main').innerHTML='<div class="empty">'+t+'</div>'}
const pn=id=>profiles[id]?.name||'Неизвестный';
const av=(p,sz)=>`<span class="av" style="background:${esc(p?.color||'#64748b')};${sz?`width:${sz}px;height:${sz}px`:''}">${esc(p?.emoji||(p?.name||'?')[0].toUpperCase())}</span>`;
function fmt(ts){const d=new Date(ts),n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('ru',{day:'numeric',month:'short'})}
const myChats=()=>chats.filter(c=>c.kind!=='dm'||(c.members||[]).includes(uid));
const other=c=>(c.members||[]).find(x=>x!==uid)||uid;
const ctitle=c=>c.kind==='dm'?(other(c)===uid?'Избранное':pn(other(c))):c.title;
const chatAv=c=>c.kind==='channel'?av({color:'#0891b2',emoji:'📢'}):c.kind==='group'?av({color:'#475569',emoji:'👥'}):other(c)===uid?av({color:'#3390ec',emoji:'🔖'}):av(profiles[other(c)]);

async function boot(){
  if(!window.claude?.use) return fail('Откройте страницу через claude.ai и войдите в аккаунт — без этого чаты не сохранятся.');
  let u;
  try{[u,db,dl]=await Promise.all([claude.use('user'),claude.use('db'),claude.use('downloads')]);uid=u&&await u.id()}catch(e){}
  if(!db||!uid) return fail('Не удалось войти. Откройте страницу в claude.ai, выполнив вход в аккаунт.');
  claude.use('room').then(r=>{room=r;if(r){r.presence({uid});r.onPeers(ch=>{peers=ch.peers;render();upTyping()})}}).catch(()=>{});
  const t=setTimeout(()=>{if(!ready.p)fail('Сервер пока недоступен. Подождите — данные подгрузятся сами.')},10000);
  db.collection('profiles').onSnapshot(s=>{profiles={};s.docs.forEach(d=>profiles[d.id]=d.data());me=profiles[uid]||null;ready.p=1;clearTimeout(t);render();if(cur)drawMsgs()},()=>fail('Ошибка доступа к данным'));
  db.doc('data/users/'+uid+'/account').onSnapshot(s=>{acct=s.exists?s.data():{}},()=>{});
  db.collection('chats').orderBy('last','desc').limit(200).onSnapshot(s=>{chats=s.docs.map(d=>({id:d.id,...d.data()}));ready.c=1;render();if(cur){const h=$('#chat .ct'),c=chats.find(x=>x.id===cur);if(h&&c)h.firstChild.textContent=ctitle(c)}},()=>{});
  db.collection('stories').orderBy('ts','desc').limit(200).onSnapshot(s=>{stories=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
}

function render(){
  if(!ready.p) return;
  const nav=$('#nav');
  if(!me||!me.username){nav.hidden=true;if(!document.activeElement?.closest('.f'))$('#main').innerHTML=profForm(true);return}
  nav.hidden=false;[...nav.children].forEach(b=>b.classList.toggle('on',b.dataset.v===tab));
  if(document.activeElement?.closest('.f')) return; // не сбивать ввод
  $('#main').innerHTML=tab==='chats'?viewChats():tab==='stories'?viewStories():profForm(false)+viewPeople();
}

function viewChats(){
  return `<h1 class="hd"><button class="ib" data-a="menu">☰</button><span style="flex:1">Мессенджер</span><button class="ib" data-a="newdm" title="Написать">✎</button></h1><div class="f" style="padding:0 16px 6px"><input id="q" placeholder="Поиск" value="${esc(q)}"></div><button class="row" data-a="saved">${av({color:'#3390ec',emoji:'🔖'})}<div class="t"><b>Избранное</b><span class="s">Заметки для себя</span></div></button><div id="cl">${chatRows()}</div>`;
}
function chatRows(){
  const l=myChats().filter(c=>!q||ctitle(c).toLowerCase().includes(q));
  return (l.length?l.map(c=>`<button class="row" data-a="open" data-id="${esc(c.id)}">${chatAv(c)}<div class="t"><b>${esc(ctitle(c))}</b><span class="s">${c.kind==='dm'&&online(other(c))?'<i style="color:#16a34a;font-style:normal">● </i>':''}${c.lastText?esc((c.lastFrom===uid?'Вы: ':c.kind==='group'?pn(c.lastFrom)+': ':'')+c.lastText):'Нет сообщений'}</span></div><time>${fmt(c.last||c.created||0)}</time></button>`).join(''):'<div class="empty">Чатов пока нет. Создайте группу или напишите человеку.</div>');
}

function activeStories(){const lim=Date.now()-864e5,g={};stories.filter(s=>s.ts>lim).forEach(s=>(g[s.from]=g[s.from]||[]).push(s));Object.values(g).forEach(a=>a.sort((x,y)=>x.ts-y.ts));return g}
function viewStories(){
  const g=activeStories(),ids=Object.keys(g).sort((a,b)=>g[b].at(-1).ts-g[a].at(-1).ts);
  return `<h1 class="hd">Истории</h1><div class="strip"><button class="st" data-a="addstory"><span class="ring add">${av(me)}</span>Добавить</button>`+
  ids.map(i=>`<button class="st" data-a="story" data-id="${esc(i)}"><span class="ring">${av(profiles[i])}</span>${esc(i===uid?'Моя':pn(i))}</button>`).join('')+`</div>`+
  (ids.length?ids.map(i=>`<button class="row" data-a="story" data-id="${esc(i)}">${av(profiles[i])}<div class="t"><b>${esc(pn(i))}</b><span class="s">${g[i].length} ист. · ${fmt(g[i].at(-1).ts)}</span></div></button>`).join(''):'<div class="empty">Свежих историй нет. Истории живут 24 часа.</div>');
}

function profForm(first){
  const p={...me,...draft};
  return `<div class="f">${first?'<div class="wl"><div class="lg">💬</div><h1>Добро пожаловать</h1><span>Создайте профиль: имя, @username и телефон. Чаты привязаны к вашему аккаунту claude.ai и не потеряются при повторном входе.</span></div>':'<h1 style="padding:8px 0">Профиль</h1>'}
  <input id="pn" placeholder="Имя" maxlength="30" value="${esc(p.name||'')}">
  <input id="pu" placeholder="@username (латиница, цифры, _)" maxlength="33" autocapitalize="off" autocomplete="off" value="${esc(p.username||'')}"><div class="hint" id="uh"></div>
  <input id="pp" type="tel" placeholder="Телефон, например +7 900 123-45-67" maxlength="20" value="${esc(p.phone??acct.phone??'')}">
  <div class="hint">Телефон виден только вам, другим он не показывается. Подтверждение по SMS недоступно: для отправки SMS нужен свой сервер.</div>
  <input id="pe" placeholder="Эмодзи-аватар (необязательно)" maxlength="8" value="${esc(p.emoji||'')}">
  <div class="sw" id="pc">${COL.map(c=>`<i data-a="col" data-c="${c}" style="background:${c}" class="${(p.color||COL[0])===c?'on':''}"></i>`).join('')}</div>
  <textarea id="pb" rows="2" maxlength="140" placeholder="О себе">${esc(p.bio||'')}</textarea>

  const l=myChats().filter(c=>!q||ctitle(c).toLowerCase().includes(q));
  return l.length?l.map(c=>{const u=c.lastFrom===uid?0:Math.max(0,(c.n||0)-(rd[c.id]||0));
    return `<button class="row" data-a="open" data-id="${esc(c.id)}">${chatAv(c)}<div class="t"><b>${esc(ctitle(c))}</b><span class="s">${c.kind==='dm'&&online(other(c))?'<i style="color:#16a34a;font-style:normal">● </i>':''}${c.lastText?esc((c.lastFrom===uid?'Вы: ':c.kind==='group'?pn(c.lastFrom)+': ':'')+c.lastText):'Нет сообщений'}</span></div><time>${fmt(c.last||c.created||0)}${u?`<i class="bg">${u>99?'99+':u}</i>`:''}</time></button>`}).join(''):'<div class="empty">Чатов пока нет. Создайте группу или напишите человеку.</div>';
}
/* чат */
function openChat(id){
  cur=id;msgs=[];reply=null;editId=null;rcv={};unM&&unM();unR&&unR();
  const c=chats.find(x=>x.id===id)||{},bn=(c.banned||[]).includes(uid),ro=(c.kind==='channel'&&c.owner!==uid)||bn;
  if(c.kind&&c.kind!=='dm'&&!bn&&!(c.members||[]).includes(uid))db.doc('chats/'+id).update({members:[...(c.members||[]),uid]}).catch(()=>{});
  const o=$('#chat');o.hidden=false;
  o.innerHTML=`<header><button class="ib" data-a="back">‹</button>${chatAv(c)}<div class="ct" data-a="ginfo">${esc(ctitle(c))}<div id="st" style="font-size:12px;font-weight:400;color:rgba(255,255,255,.75)"></div></div><button class="ib" data-a="export" title="Скачать историю">⤓</button></header><div id="pinb" class="pbar" hidden></div><div id="ml"></div>${ro?`<div class="empty" style="padding:14px">${bn?'Вы заблокированы в этом чате':'Писать в канале может только его владелец'}</div>`:'<div id="rb" class="rp" style="margin:6px 12px 0" hidden></div><div class="cb"><button class="ib" data-a="emo">😊</button><button class="ib" data-a="attach">📎</button><input id="mi" placeholder="Сообщение" autocomplete="off"><button class="send" data-a="send">➤</button></div><input type="file" id="fi" hidden>'}`;
  unM=db.collection('chats/'+id+'/msgs').orderBy('ts','desc').limit(300).onSnapshot(s=>{msgs=s.docs.map(d=>({id:d.id,...d.data()})).reverse();drawMsgs()},()=>toast('Не удалось загрузить сообщения'));
  unR=db.collection('chats/'+id+'/reads').onSnapshot(s=>{rcv={};s.docs.forEach(d=>rcv[d.id]=d.data().ts);drawMsgs(true)},()=>{});
}
function drawPin(){
  const b=$('#pinb');if(!b)return;const c=chats.find(x=>x.id===cur)||{};
  if(c.pin){b.hidden=false;b.dataset.a='pinmenu';b.innerHTML='📌 <b>Закреплено:</b> '+esc(c.pin.t)}else b.hidden=true;
}
function drawMsgs(nm){
  const l=$('#ml');if(!l)return;const c=chats.find(x=>x.id===cur)||{};
  const near=l.scrollHeight-l.scrollTop-l.clientHeight<80,seen=m=>Object.entries(rcv).some(([u,t])=>u!==uid&&t>=m.ts);
  const vis=msgs.filter(m=>m.from===uid||!st.bl.includes(m.from));
  l.innerHTML=vis.length?vis.map(m=>{
    const rx={};Object.values(m.rx||{}).forEach(e=>e&&(rx[e]=(rx[e]||0)+1));
    return `<div class="m ${m.from===uid?'me':''}" data-a="msg2" data-id="${esc(m.id)}">${c.kind==='group'&&m.from!==uid?`<span class="n">${esc(pn(m.from))}</span>`:''}${m.re?`<span class="rp"><b>${esc(m.re.n)}</b><br>${esc(m.re.t)}</span>`:''}${m.att?(m.att.t==='img'?`<img class="im" src="${esc(m.att.u)}" alt="" data-a="zoom" data-u="${esc(m.att.u)}">`:`<button class="fl" data-a="getf" data-u="${esc(m.att.u)}" data-n="${esc(m.att.n)}">📄 ${esc(m.att.n)}</button>`):''}${esc(m.text||'')}<time>${m.ed?'изм. ':''}${fmt(m.ts)}${m.from===uid?(seen(m)?' ✓✓':' ✓'):''}</time>${Object.keys(rx).length?`<div class="rx">${Object.entries(rx).map(([e,n])=>`<span>${e} ${n}</span>`).join('')}</div>`:''}</div>`}).join(''):'<div class="empty">Напишите первое сообщение</div>';
  if(near||l.dataset.i!==cur){l.scrollTop=l.scrollHeight;l.dataset.i=cur}
  upTyping();drawPin();if(!nm&&!document.hidden)markRead();
}
async function send(att){
  const i=$('#mi');if(!i)return;const t=i.value.trim();if(!t&&!att)return;
  const c=chats.find(x=>x.id===cur)||{};
  if((c.banned||[]).includes(uid))return toast('Вы заблокированы в этом чате');
  i.value='';const now=Date.now();
  if(editId&&!att){const id=editId;editId=null;{const r=$('#rb');if(r)r.hidden=true}try{await db.doc('chats/'+cur+'/msgs/'+id).update({text:t.slice(0,2000),ed:true})}catch(e){toast('Не удалось изменить')}return}
  try{
    await db.collection('chats/'+cur+'/msgs').add({from:uid,text:t.slice(0,2000),ts:now,...(att?{att}:{}),...(reply?{re:reply}:{})});
    reply=null;{const r=$('#rb');if(r)r.hidden=true}
    await db.doc('chats/'+cur).update({last:now,lastText:(t||(att.t==='img'?'📷 Фото':'📎 '+att.n)).slice(0,60),lastFrom:uid,n:(c.n||0)+1});
  }catch(e){i.value=t;toast('Не отправлено — попробуйте ещё раз')}
}
/* вложения */
function shrink(f){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.85)};im.onerror=rej;im.src=u})}
async function upl(f){
  if(!assets)throw new Error('noassets');
  let blob=f,t='file';
  if(f.type.startsWith('image/')){t='img';if(f.type!=='image/gif'&&f.type!=='image/svg+xml'){try{blob=await shrink(f)}catch(e){blob=f}}}
  if(blob.size>20*1048576)throw new Error('big');
  const r=await assets.upload(blob);return{u:r.url,t,n:f.name,s:f.size};
}
async function sendFile(f){
  try{toast('Загрузка…');await send(await upl(f))}
  catch(e){toast(e.message==='big'?'Файл больше 20 МБ':e.message==='noassets'?'Загрузка файлов недоступна для вашего доступа':'Не удалось загрузить файл')}
  const fi=$('#fi');if(fi)fi.value='';
}
/* истории */
async function postStory(){
  const t=$('#stx').value.trim();if(!t&&!stFile)return;closeM();let img=null;
  try{if(stFile){toast('Загрузка…');img=(await upl(stFile)).u}
    await db.collection('stories').add({from:uid,text:t.slice(0,200),bg:storyBg,ts:Date.now(),...(img?{img}:{})});tab='stories';render()}
  catch(e){toast('Не удалось опубликовать')}
  stFile=null;
}
function showStory(authorId,i=0){
  const list=activeStories()[authorId]||[];if(!list.length)return;
  const s=list[i],sv=$('#sv');clearTimeout(svT);sv.hidden=false;
  sv.style.background=s.img?`#000 url("${String(s.img).replace(/"/g,'')}") center/contain no-repeat`:s.bg;
  sv.innerHTML=`<div class="bars">${list.map((_,k)=>`<i class="${k<=i?'d':''}"></i>`).join('')}</div><div class="sh">${av(profiles[authorId],36)}<b style="flex:1">${esc(pn(authorId))}</b><small id="vw">${fmt(s.ts)}</small>${authorId===uid?`<button class="ib" data-a="delstory" data-id="${esc(s.id)}">🗑</button>`:''}<button class="ib" data-a="closesv">✕</button></div><div class="tx" data-a="snext" data-u="${esc(authorId)}" data-i="${i}" style="${s.img?'align-items:flex-end;text-shadow:0 1px 6px #000;font-size:20px':''}">${esc(s.text)}</div>${authorId!==uid?`<div class="sr"><input id="sri" placeholder="Ответить…" onfocus="clearTimeout(svT)"><button class="send" data-a="sreply" data-u="${esc(authorId)}" data-i="${i}">➤</button></div>`:''}`;
  svT=setTimeout(()=>nextStory(authorId,i),5000);
  if(authorId!==uid)db.doc('stories/'+s.id+'/views/'+uid).set({ts:Date.now()}).catch(()=>{});
  else db.collection('stories/'+s.id+'/views').get().then(q=>{const v=$('#vw');if(v)v.textContent='👁 '+q.docs.length+' · '+fmt(s.ts)}).catch(()=>{});
}
/* события */
document.addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  if(e.target.id==='fi')sendFile(f);
  if(e.target.id==='sfi'){stFile=f;const b=$('#sfl');if(b)b.textContent='📷 '+f.name.slice(0,24)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lpin')tryUnlock()});
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id;
  const c=chats.find(x=>x.id===cur)||{},M=i=>msgs.find(x=>x.id===i);
  if(a==='msg2'){
    const m=M(id);if(!m)return;const ro=c.kind==='channel'&&c.owner!==uid,mine=m.from===uid;
    sheet(`<div class="rp">${esc((m.text||m.att?.n||'').slice(0,120))}</div><div class="emr">${['👍','❤️','😂','😮','😢','🙏'].map(x=>`<button class="ib" data-a="react" data-id="${esc(id)}" data-e="${x}">${x}</button>`).join('')}</div>`+(ro?'':`<button class="btn g" data-a="reply" data-id="${esc(id)}">↩ Ответить</button>`)+(mine&&m.text?`<button class="btn g" data-a="edit" data-id="${esc(id)}">✏️ Изменить</button>`:'')+(canMod(c)?`<button class="btn g" data-a="pin" data-id="${esc(id)}">📌 Закрепить</button>`:'')+(mine?`<button class="btn g" data-a="delmsg" data-id="${esc(id)}">🗑 Удалить</button>`:''));
  }
  else if(a==='react'){const m=M(id);closeM();if(m)db.doc('chats/'+cur+'/msgs/'+id).update({rx:{[uid]:m.rx?.[uid]===t.dataset.e?'':t.dataset.e}}).catch(()=>toast('Не удалось'))}
  else if(a==='edit'){const m=M(id);closeM();const i=$('#mi');if(!m||!i)return;editId=id;i.value=m.text;i.focus();const rb=$('#rb');if(rb){rb.hidden=false;rb.innerHTML='✏️ Изменение сообщения <button class="ib" style="width:22px;height:22px;font-size:12px" data-a="noedit">✕</button>'}}
  else if(a==='noedit'){editId=null;$('#mi').value='';$('#rb').hidden=true}
  else if(a==='pin'){const m=M(id);closeM();if(m)db.doc('chats/'+cur).update({pin:{id,t:(m.text||m.att?.n||'').slice(0,60)}}).catch(()=>toast('Не удалось'))}
  else if(a==='pinmenu'){if(canMod(c)&&c.pin)sheet(`<div class="rp">${esc(c.pin.t)}</div><button class="btn g" data-a="unpin">Открепить</button>`)}
  else if(a==='unpin'){closeM();db.doc('chats/'+cur).update({pin:null}).catch(()=>{})}
  else if(a==='attach'){if(!assets)toast('Загрузка файлов недоступна для вашего доступа');else $('#fi').click()}
  else if(a==='zoom'){const sv=$('#sv');sv.hidden=false;sv.style.background='#000';sv.innerHTML=`<div data-a="closesv" style="margin:auto;max-width:100%;max-height:100%;display:flex"><img src="${esc(t.dataset.u)}" alt="" style="max-width:100%;max-height:100vh;margin:auto"></div>`}
  else if(a==='getf'){try{const b=await (await fetch(t.dataset.u)).blob();dl?await dl.save({filename:t.dataset.n,data:b}):toast('Скачивание недоступно')}catch(x){toast('Не удалось скачать файл')}}
  else if(a==='addstory'){stFile=null;sheet(`<b>Новая история</b><textarea id="stx" rows="3" maxlength="200" placeholder="Что нового?"></textarea><label class="btn g" id="sfl" style="text-align:center">📷 Добавить фото<input type="file" id="sfi" accept="image/*" hidden></label><div class="sw">${COL.map(x=>`<i data-a="sbg" data-c="${x}" style="background:${x}" class="${storyBg===x?'on':''}"></i>`).join('')}</div><button class="btn" data-a="post">Опубликовать</button>`)}
  else if(a==='sreply'){
    const v=$('#sri').value.trim();if(!v)return;const o=t.dataset.u,sd=(activeStories()[o]||[])[+t.dataset.i],now=Date.now();
    const did='dm_'+[uid,o].map(x=>x.replace(/[^A-Za-z0-9_-]/g,'')).sort().join('_'),ref=db.doc('chats/'+did);
    try{const s=await ref.get();if(!s.exists)await ref.set({kind:'dm',members:[uid,o],created:now,last:now,lastText:'',lastFrom:uid,n:0});
      await db.collection('chats/'+did+'/msgs').add({from:uid,text:v.slice(0,500),ts:now,re:{n:'Ответ на историю',t:(sd?.text||'📷 Фото').slice(0,50)}});
      await ref.update({last:now,lastText:v.slice(0,60),lastFrom:uid,n:((s.exists&&s.data().n)||0)+1});$('#sri').value='';toast('Отправлено')}
    catch(x){toast('Не удалось отправить')}
  }
  else if(a==='ginfo'){
    if(c.kind==='dm'){if(other(c)!==uid){const b=document.createElement('button');b.dataset.a='person';b.dataset.id=other(c);document.body.append(b);b.click();b.remove()}return}
    const mem=c.members||[];
    sheet(`<b>${esc(c.title||'')}</b><div class="hint" style="margin:0">${c.kind==='channel'?'Канал':'Группа'} · участников: ${mem.length}</div>`+mem.map(u=>`<button class="row" style="margin:0;width:100%;padding:6px 0" data-a="mem" data-id="${esc(u)}">${av(profiles[u])}<div class="t"><b>${esc(pn(u))}</b><span class="s">${u===c.owner?'владелец':(c.admins||[]).includes(u)?'админ':''}${(c.banned||[]).includes(u)?' · заблокирован':''}</span></div></button>`).join(''));
  }
  else if(a==='mem'){
    const u=id,own=c.owner===u,adm=(c.admins||[]).includes(u),bn=(c.banned||[]).includes(u),mod=canMod(c)&&c.kind!=='dm'&&!own&&u!==uid;
    sheet(`<div style="text-align:center">${av(profiles[u],64)}<h3 style="margin:8px 0 0">${esc(pn(u))}</h3><div style="color:var(--ac)">${profiles[u]?.username?'@'+esc(profiles[u].username):''}</div></div>`+(u!==uid?`<button class="btn g" data-a="dm" data-id="${esc(u)}">✉️ Написать</button><button class="btn g" data-a="blk" data-id="${esc(u)}">${st.bl.includes(u)?'Разблокировать у себя':'🚫 Заблокировать у себя'}</button>`:'')+(mod?`${c.owner===uid?`<button class="btn g" data-a="adm" data-id="${esc(u)}">${adm?'Снять права админа':'⭐ Назначить админом'}</button>`:''}<button class="btn g" data-a="ban" data-id="${esc(u)}">${bn?'Вернуть в чат':'⛔ Заблокировать в чате'}</button>`:''));
  }
  else if(a==='blk'){st.bl=st.bl.includes(id)?st.bl.filter(x=>x!==id):[...st.bl,id];store.set('mset',st);closeM();drawMsgs(true)}
  else if(a==='adm'){closeM();const s=c.admins||[];db.doc('chats/'+cur).update({admins:s.includes(id)?s.filter(x=>x!==id):[...s,id]}).catch(()=>{})}
  else if(a==='ban'){closeM();const s=c.banned||[];db.doc('chats/'+cur).update({banned:s.includes(id)?s.filter(x=>x!==id):[...s,id]}).catch(()=>{})}
  else if(a==='settings')settingsSheet();
  else if(a==='th'||a==='wp'){st[a]=+t.dataset.i;store.set('mset',st);applyTheme();settingsSheet()}
  else if(a==='snd'){st.snd=st.snd?0:1;store.set('mset',st);settingsSheet()}
  else if(a==='pinset'){const p=$('#pinin').value;if(!/^\d{4,8}$/.test(p))return toast('PIN: 4–8 цифр');store.set('pinh',await hp(p));toast('PIN установлен');settingsSheet()}
  else if(a==='pinoff'){try{localStorage.removeItem('pinh')}catch(x){}settingsSheet()}
  else if(a==='unlock')tryUnlock();
});
function init2(){
  if(!db||!uid)return;
  claude.use('assets').then(a=>assets=a).catch(()=>{});
  db.doc('data/users/'+uid+'/reads').onSnapshot(s=>{rd=s.exists?s.data():{};rdOK=1;render()},()=>{});
  db.collection('chats').orderBy('last','desc').limit(200).onSnapshot(s=>{
    const first=prevLast===null;prevLast=prevLast||{};
    s.docs.forEach(d=>{const x=d.data(),p=prevLast[d.id];
      if(!first&&p!==undefined&&(x.last||0)>p&&x.lastFrom!==uid&&(x.kind!=='dm'||(x.members||[]).includes(uid))&&!(d.id===cur&&!document.hidden)){beep();flash()}
      prevLast[d.id]=x.last||0;
      if(d.id===cur&&!document.hidden)markRead(x.n||0)});
  },()=>{});
}

lock();applyTheme();boot().then(init2);
</script>
</body></html>
